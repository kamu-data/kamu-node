name: build
on:
  push:
    paths-ignore:
      - "docs/**"
      - "images/**"
      - "**.md"
  # manual trigger
  workflow_dispatch: { }
env:
  # Decide crate freshness by file checksums, not mtimes, so that unchanged workspace crates
  # restored from the cache are reused after `actions/checkout` resets all mtimes
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  RUST_LOG: "debug"
  RUST_LOG_SPAN_EVENTS: "new,close"
  RUST_BACKTRACE: "1"
jobs:
  lint_fmt:
    name: Lint / Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
      - uses: cargo-bins/cargo-binstall@main
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo sort
        run: |
          cargo binstall cargo-sort -y
          cargo sort -g -w -n -c
      - name: taplo fmt
        run: |
          cargo binstall taplo-cli -y
          taplo fmt --check
      - name: license headers
        run: cargo test -p kamu-repo-tools -- license_header
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  lint_deps:
    name: Lint / Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall cargo-deny -y
      - run: cargo deny check --hide-inclusion-graph
      - run: cargo binstall cargo-udeps -y
      - run: cargo udeps --all-targets

  test_linux:
    name: Test / Linux
    runs-on: ubuntu-latest
    env:
      CARGO_FLAGS: --profile ci --features kamu/ingest-ftp
      NEXTEST_FLAGS: --cargo-profile ci --features kamu/ingest-ftp
      KAMU_CONTRACTS_DIR: ../../../kamu-contracts
    services:
      postgres:
        # Keep in sync with `POSTGRES_IMAGE` in `Makefile`
        image: 'postgres:18'
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: kamu-test
        ports:
          - 5432:5432
    steps:
      # ToDo: remove one of the checkout actions
      # Currently it will cause pipeline failure:
      # https://github.com/kamu-data/kamu-node/actions/runs/13438038265/job/37545092136
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: kamu-data/kamu-contracts
          path: kamu-contracts
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # Prevents branch builds from evicting master cache
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
          # Requires CARGO_UNSTABLE_CHECKSUM_FRESHNESS
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo tools
        run: cargo binstall cargo-nextest -y --force
      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build node
        run: cargo test ${{ env.CARGO_FLAGS }} --no-run
      - name: Build contracts
        working-directory: kamu-contracts
        run: |
          npm ci
          forge build

      - name: Run main set of tests
        run: cargo nextest run ${{ env.NEXTEST_FLAGS }} -E '!(test(::database::) | test(::spark::) | test(::flink::))'

      - name: SQLite database tests
        env:
          SQLX_OFFLINE: false
          DATABASE_URL: sqlite://kamu.sqlite.db
        run: cargo nextest run ${{ env.NEXTEST_FLAGS }} -E 'test(::sqlite::)'

      - name: Postgres database tests
        env:
          SQLX_OFFLINE: false
          DATABASE_URL: postgres://root:root@localhost:5432/kamu-test
          # Used by the schema dump test to run `pg_dump` in a container
          KAMU_CONTAINER_RUNTIME_TYPE_DB: docker
          KAMU_POSTGRES_IMAGE: postgres:18
        run: cargo nextest run ${{ env.NEXTEST_FLAGS }} -E 'test(::postgres::)'

      - name: Check git diff
        run: git diff && git diff-index --quiet HEAD
