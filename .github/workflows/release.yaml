name: release
on:
  # Manual trigger
  workflow_dispatch: {}
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
jobs:
  build_linux:
    name: Build / Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - kamu-api-server
          - kamu-oracle-provider
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          target: ${{ matrix.target }}
          cache: false
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cross
        run: cargo binstall cross -y
      - name: Build
        run: cross build -p ${{ matrix.crate }} --release --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.crate }}
          if-no-files-found: error
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build_linux ]
    steps:
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --title "Release ${{ github.ref_name }}" \
            --notes ""
  upload_assets_targz:
    name: Upload Assets (tar.gz)
    runs-on: ubuntu-latest
    needs: [ create_release ]
    strategy:
      matrix:
        crate:
          - kamu-api-server
          - kamu-oracle-provider
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ matrix.target }}
          path: ${{ matrix.crate }}-${{ matrix.target }}
      - name: Compress Artifacts
        run: tar -czvf ${{ matrix.crate }}-${{ matrix.target }}.tar.gz ${{ matrix.crate }}-${{ matrix.target }}
      - name: Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            ${{ matrix.crate }}-${{ matrix.target }}.tar.gz
